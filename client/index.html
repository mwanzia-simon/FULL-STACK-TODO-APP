<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FULL STACK TODO APP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-color: powderblue">
    <script src="main.js"></script>
    <h1>To Do List</h1>
    <div class="container">
      <div class="add-todo-inputs">
        <input
          id="add-todo-input"
          type="text"
          placeholder="add your to do here ..."
        />
        <button id="add-todo-btn">+</button>
      </div>
      <div class="todos">
        <div class="todo">
          <input type="checkbox" />
          <p class="todo_content">Feed Charby</p>
          <div class="action_btns">
            <button id="edit_btn">Edit</button>
            <button id="delete_btn">Delete</button>
          </div>
        </div>
        <div class="todo">
          <input type="checkbox" />
          <p class="todo_content">Feed Charby</p>
          <div class="action_btns">
            <button id="edit_btn">Edit</button>
            <button id="delete_btn">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
